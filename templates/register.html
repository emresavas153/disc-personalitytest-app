{% extends "base.html" %}
{% block content %}

<h1>Host Registrierung</h1>

{% if error %}
  <p style="color: var(--danger);">{{ error }}</p>
{% endif %}

<form method="POST" action="{{ url_for('register_post') }}">
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required>
  </div>

  <div class="form-group">
    <label for="email">E-Mail</label>
    <input id="email" name="email" type="text" required>
  </div>

  <div class="form-group">
    <label for="password">Passwort</label>
    <input id="password" name="password" type="text" required>
  </div>

  <div class="btn-row" style="margin-top: 1rem;">
    <button class="btn btn-primary" type="submit">Account erstellen</button>
    <a class="btn btn-secondary" href="{{ url_for('login_get') }}">Zurück zum Login</a>
  </div>
</form>

{% endblock %}
